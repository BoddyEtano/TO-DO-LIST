<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check-list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="board">
      <div class="pin pin-1"></div>
      <div class="pin pin-2"></div>
      <div class="pin pin-3"></div>
      <div class="pin pin-4"></div>
      <div class="pin pin-5"></div>

      <div class="container notebook">
        <div class="spiral" aria-hidden="true"></div>
        <h1>Check-list</h1>

        <div class="input-row">
          <input id="taskInput" type="text" placeholder="Add a new task..." />
          <button id="addBtn">Add</button>
        </div>

        <div class="sort-row">
          <button id="sortBtn" aria-pressed="false">Sort A-Z</button>
        </div>

        <ul id="taskList"></ul>

        <div class="actions">
          <button id="deleteBtn">Delete selected</button>
          <button id="undoBtn">Undo</button>
          <button id="restartBtn">Restart</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
